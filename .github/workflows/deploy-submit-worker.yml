name: Deploy Submit Package Worker

on:
  push:
    branches: [main]
    paths:
      - 'api/submit-package-worker.js'
      - 'wrangler-submit.toml'
      - '.github/workflows/deploy-submit-worker.yml'
  workflow_dispatch: # manual redeploy after secrets configured

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::GitHub Secret CLOUDFLARE_API_TOKEN არ არის (Settings → Secrets → Actions)"; exit 1; }
          test -n "$RESEND_API_KEY" || { echo "::error::GitHub Secret RESEND_API_KEY არ არის"; exit 1; }

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 8e95b92a654fdc8ee313d736a7a26910
          wranglerVersion: '3'
          command: deploy --config wrangler-submit.toml

      - name: Set RESEND_API_KEY secret on worker
        run: printf '%s' "$RESEND_API_KEY" | npx wrangler@3 secret put RESEND_API_KEY --config wrangler-submit.toml
